  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f0f7ff;
      user-select: none;
    }
    input {
      user-select: text;
    }
    .math-font {
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
    }
    .canvas-container {
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }
    /* 第二關圖形加強輪廓與標籤對比，縮放後仍易辨認 */
    #layerBaseShape polygon, #layerBaseShape polyline, #layerBaseShape line {
      vector-effect: non-scaling-stroke;
    }
    #layerDimensions text {
      font-size: 17px !important;
      font-weight: 900 !important;
      paint-order: stroke fill;
      stroke-width: 5px !important;
    }
    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

  <!-- 頂部導航與關卡／進度欄 -->
  <header class="bg-white border-b border-sky-100 shadow-sm sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div id="headerIconBox" class="w-10 h-10 rounded-xl bg-sky-500 text-white flex items-center justify-center shadow-md shadow-sky-200 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 18V8h7l6-5v10l-6 5H4z" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-extrabold text-slate-800 tracking-tight">多邊形的面積</h1>
          <p id="headerSubtitle" class="text-xs text-slate-500 font-medium">香港小學五年級數學｜第一關：分割法與填補法</p>
        </div>
      </div>

      <!-- 關卡切換器 -->
      <div class="flex items-center bg-slate-100 p-1 rounded-2xl border border-slate-200">
        <button id="level1TabBtn" type="button" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold bg-sky-600 text-white shadow-sm transition">
          第一關：分割與填補
        </button>
        <button id="level2TabBtn" type="button" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold text-slate-600 hover:text-slate-900 transition">
          第二關：重疊圖形
        </button>
      </div>

      <!-- 進度顯示 -->
      <div class="flex items-center gap-3 sm:gap-5 flex-1 sm:flex-initial justify-end">
        <div id="penaltyBadge" class="hidden items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold border border-amber-300">
          <span>⚠️ 答錯加題：</span>
          <span id="addedCountText">+0 題</span>
        </div>

        <div class="flex flex-col items-end min-w-[140px] sm:min-w-[185px]">
          <div class="flex items-baseline gap-2 text-sm font-bold text-slate-700">
            <span>進度：</span>
            <span class="text-sky-600 text-base sm:text-lg math-font" id="progressText">第 1 / 8 題</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden mt-1 border border-slate-200">
            <div id="progressBar" class="h-full bg-gradient-to-r from-sky-400 to-blue-600 rounded-full transition-all duration-500" style="width: 12.5%;"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主練習區（左右分欄） -->
  <main id="practiceArea" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
    
    <!-- 左邊區域：互動圖形畫布 (7 cols on lg) -->
    <section class="lg:col-span-7 bg-white rounded-3xl shadow-md shadow-sky-900/5 border border-sky-100 flex flex-col overflow-hidden">
      <!-- 圖形區標題 -->
      <div id="leftHeaderBar" class="px-5 py-3.5 bg-sky-50/70 border-b border-sky-100 flex flex-col gap-1">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span id="levelBadge" class="inline-flex items-center justify-center px-2.5 h-6 rounded-full bg-sky-600 text-white text-xs font-extrabold">第一關</span>
            <h2 class="font-bold text-slate-800 text-sm sm:text-base leading-snug" id="questionTitle">求下圖著色多邊形的面積。</h2>
          </div>
        </div>
        <p id="questionSubDesc" class="text-xs font-medium text-slate-500 pl-1">
          觀察圖中的直角記號，運用分割法或填補法計算
        </p>
      </div>

      <!-- 繪圖輔助工具列 -->
      <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200/80 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2 flex-wrap">
          <button id="toggleDrawBtn" type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-sky-600 text-white shadow-sm hover:bg-sky-700 active:scale-95 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
            <span>畫直線（輔助線）</span>
          </button>

          <button id="undoLineBtn" type="button" class="flex items-center gap-1 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 active:scale-95 transition disabled:opacity-40" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
            </svg>
            <span>復原</span>
          </button>

          <button id="clearLinesBtn" type="button" class="flex items-center gap-1 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-white text-rose-600 border border-rose-200 hover:bg-rose-50 active:scale-95 transition disabled:opacity-40" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span>清除輔助線</span>
          </button>
        </div>

        <button id="showHintLineBtn" type="button" class="hidden items-center gap-1 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-amber-500 text-white shadow-sm hover:bg-amber-600 active:scale-95 transition">
          <span>💡 顯示解題提示線</span>
        </button>
      </div>

      <!-- SVG 互動畫布區 -->
      <div class="relative flex-1 min-h-[370px] sm:min-h-[450px] canvas-container flex items-center justify-center p-2 touch-none" id="svgWrapper">
        <svg id="geometrySvg" viewBox="0 0 600 450" class="w-full h-full max-h-[480px] cursor-crosshair">
          <defs>
            <!-- 教科書風格雙箭頭 -->
            <marker id="arrowStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 10 1.5 L 1 5 L 10 8.5 z" fill="#334155" />
            </marker>
            <marker id="arrowEnd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155" />
            </marker>
            <!-- 指示箭頭（用於指向「重疊部分」或圖一變圖二） -->
            <marker id="pointerArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b" />
            </marker>
          </defs>
          <!-- 圖形層 -->
          <g id="layerBaseShape"></g>
          <!-- 參考提示線層 -->
          <g id="layerHintLines"></g>
          <!-- 標註尺寸層 -->
          <g id="layerDimensions"></g>
          <!-- 學生自繪輔助線層 -->
          <g id="layerUserLines"></g>
          <!-- 吸附點與預覽線層 -->
          <g id="layerSnapAndPreview"></g>
        </svg>

        <!-- 操作小提示浮標 -->
        <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between pointer-events-none">
          <span id="canvasTipText" class="bg-white/90 backdrop-blur-sm text-slate-600 text-xs px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm">
            ✏️ 在圖形上拖曳滑鼠或手指畫虛線進行<b>分割</b>或<b>填補</b>（自動吸附頂點）
          </span>
        </div>
      </div>
    </section>

    <!-- 右邊區域：列式計算區 (5 cols on lg) -->
    <section class="lg:col-span-5 bg-white rounded-3xl shadow-md shadow-sky-900/5 border border-sky-100 flex flex-col justify-between overflow-hidden">
      <div>
        <!-- 右欄頂部 -->
        <div class="px-5 py-3.5 bg-indigo-50/70 border-b border-indigo-100 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold">算</span>
            <h2 class="font-bold text-slate-700 text-sm sm:text-base">列式計算（必須先寫對橫式）</h2>
          </div>
          <span id="attemptStatusBadge" class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
            首次作答
          </span>
        </div>

        <div class="p-5 space-y-5">
          <!-- 方法選擇器（第一關與第二關動態切換按鈕標籤） -->
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
              步驟 1：選擇你的解題思路（可自由切換）
            </label>
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" id="methodSplitBtn" data-method="split" class="method-btn flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-2xl border-2 border-sky-500 bg-sky-50 text-sky-800 font-bold text-sm transition">
                <span id="methodBtn1Label">✂️ 分割法</span>
                <span id="methodBtn1Sub" class="text-xs font-normal text-sky-600">(相加)</span>
              </button>
              <button type="button" id="methodFillBtn" data-method="fill" class="method-btn flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-2xl border-2 border-slate-200 bg-white text-slate-600 hover:border-slate-300 font-bold text-sm transition">
                <span id="methodBtn2Label">🧩 填補法</span>
                <span id="methodBtn2Sub" class="text-xs font-normal text-slate-400">(相減)</span>
              </button>
            </div>
          </div>

          <!-- 橫式輸入區 -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="expressionInput" class="block text-sm font-bold text-slate-700">
                步驟 2：輸入計算橫式
              </label>
              <span id="exprExampleHint" class="text-xs text-slate-400">例：9 × 9 + 12 × 9</span>
            </div>
            
            <div class="relative">
              <input
                id="expressionInput"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="請輸入橫式，例如：(9 + 21) × 9 ÷ 2"
                class="w-full px-4 py-3 text-lg font-bold math-font rounded-2xl border-2 border-slate-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition bg-slate-50 focus:bg-white text-slate-800"
              />
            </div>

            <!-- 數學符號快捷鍵 -->
            <div class="mt-2.5 flex items-center gap-1.5 flex-wrap">
              <span class="text-xs font-bold text-slate-400 mr-1">快捷符號：</span>
              <button type="button" data-symbol=" + " class="sym-btn w-9 h-9 rounded-xl bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 font-bold text-lg text-slate-700 border border-slate-200 transition active:scale-90">+</button>
              <button type="button" data-symbol=" - " class="sym-btn w-9 h-9 rounded-xl bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 font-bold text-lg text-slate-700 border border-slate-200 transition active:scale-90">−</button>
              <button type="button" data-symbol=" × " class="sym-btn w-9 h-9 rounded-xl bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 font-bold text-lg text-slate-700 border border-slate-200 transition active:scale-90">×</button>
              <button type="button" data-symbol=" ÷ " class="sym-btn w-9 h-9 rounded-xl bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 font-bold text-lg text-slate-700 border border-slate-200 transition active:scale-90">÷</button>
              <button type="button" data-symbol="(" class="sym-btn w-9 h-9 rounded-xl bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 font-bold text-lg text-slate-700 border border-slate-200 transition active:scale-90">(</button>
              <button type="button" data-symbol=")" class="sym-btn w-9 h-9 rounded-xl bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 font-bold text-lg text-slate-700 border border-slate-200 transition active:scale-90">)</button>
              <button type="button" id="clearExprBtn" class="ml-auto px-2.5 h-9 rounded-xl bg-slate-100 hover:bg-rose-100 hover:text-rose-600 text-xs font-bold text-slate-500 border border-slate-200 transition">清空橫式</button>
            </div>
          </div>

          <!-- 答案輸入區 -->
          <div>
            <label id="answerLabel" for="answerInput" class="block text-sm font-bold text-slate-700 mb-1.5">
              步驟 3：計算多邊形的面積
            </label>
            <div class="flex items-center gap-3">
              <span class="text-lg font-extrabold text-slate-600">面積 =</span>
              <input
                id="answerInput"
                type="number"
                step="any"
                placeholder="輸入數字"
                class="flex-1 px-4 py-3 text-xl font-extrabold math-font rounded-2xl border-2 border-slate-300 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition bg-slate-50 focus:bg-white text-slate-800"
              />
              <span id="unitDisplay" class="text-lg font-extrabold text-slate-700 bg-slate-100 px-3.5 py-3 rounded-2xl border border-slate-200 math-font">
                cm²
              </span>
            </div>
          </div>

          <!-- 即時回饋與教學提示框 -->
          <div id="feedbackBox" class="hidden rounded-2xl p-4 border-2 text-sm leading-relaxed animate-pop">
            <div class="flex items-start gap-3">
              <div id="feedbackIcon" class="text-xl mt-0.5">💡</div>
              <div class="flex-1">
                <p id="feedbackTitle" class="font-extrabold text-base mb-1"></p>
                <p id="feedbackMessage" class="font-medium"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部提交與下一題按鈕區 -->
      <div class="p-5 bg-slate-50 border-t border-slate-200/80 flex flex-col sm:flex-row gap-3">
        <button
          id="submitBtn"
          type="button"
          class="flex-1 py-3.5 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-base shadow-lg shadow-indigo-200 active:scale-[0.99] transition flex items-center justify-center gap-2"
        >
          <span>核對橫式與答案</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">

  <script>
    /**
     * =========================================================================
     * 1. 安全數學表達式解析與求值器 (支援 +, -, *, ×, /, ÷, 括號, 小數)
     * =========================================================================
     */
    function evaluateMathExpression(rawExpr) {
      if (!rawExpr || typeof rawExpr !== 'string') {
        return { valid: false, error: '請先輸入計算橫式！' };
      }

      let expr = rawExpr
        .replace(/\s+/g, '')
        .replace(/×/g, '*')
        .replace(/x/gi, '*')
        .replace(/÷/g, '/')
        .replace(/：/g, '/')
        .replace(/＋/g, '+')
        .replace(/－/g, '-')
        .replace(/—/g, '-')
        .replace(/（/g, '(')
        .replace(/）/g, ')');

      if (expr.length === 0) {
        return { valid: false, error: '請先輸入計算橫式！' };
      }

      if (!/^[0-9+\-*/().]+$/.test(expr)) {
        return { valid: false, error: '橫式包含無效的文字或符號，請只輸入數字與運算符號（+ − × ÷ 括號）。' };
      }

      if (!/[+\-*/]/.test(expr)) {
        return { valid: false, error: '請寫出完整的計算步驟（橫式），不可只填寫一個數字！' };
      }

      expr = expr.replace(/(\d)\(/g, '$1*(').replace(/\)\(/g, ')*(').replace(/\)(\d)/g, ')*$1');

      let balance = 0;
      for (const ch of expr) {
        if (ch === '(') balance++;
        if (ch === ')') balance--;
        if (balance < 0) return { valid: false, error: '橫式的括號「)」多了一個，請檢查括號配對。' };
      }
      if (balance !== 0) {
        return { valid: false, error: '橫式的括號「( )」未有閉合，請檢查括號配對。' };
      }

      let pos = 0;
      function parseExpression() {
        let value = parseTerm();
        while (pos < expr.length && (expr[pos] === '+' || expr[pos] === '-')) {
          const op = expr[pos++];
          const right = parseTerm();
          if (op === '+') value += right;
          else value -= right;
        }
        return value;
      }

      function parseTerm() {
        let value = parseFactor();
        while (pos < expr.length && (expr[pos] === '*' || expr[pos] === '/')) {
          const op = expr[pos++];
          const right = parseFactor();
          if (op === '*') value *= right;
          else {
            if (Math.abs(right) < 1e-12) throw new Error('除數不能為 0');
            value /= right;
          }
        }
        return value;
      }

      function parseFactor() {
        if (expr[pos] === '+') {
          pos++;
          return parseFactor();
        }
        if (expr[pos] === '-') {
          pos++;
          return -parseFactor();
        }
        if (expr[pos] === '(') {
          pos++;
          const val = parseExpression();
          if (expr[pos] !== ')') throw new Error('缺少右括號');
          pos++;
          return val;
        }
        const start = pos;
        let dotCount = 0;
        while (pos < expr.length && ((expr[pos] >= '0' && expr[pos] <= '9') || expr[pos] === '.')) {
          if (expr[pos] === '.') dotCount++;
          pos++;
        }
        if (start === pos || dotCount > 1) {
          throw new Error('數字格式不正確');
        }
        return parseFloat(expr.slice(start, pos));
      }

      try {
        const result = parseExpression();
        if (pos !== expr.length || Number.isNaN(result) || !Number.isFinite(result)) {
          return { valid: false, error: '橫式算式不完整，請檢查運算符號前後是否有數字。' };
        }
        const numbersUsed = (expr.match(/\d+(\.\d+)?/g) || []).map(Number);
        return { valid: true, value: Math.round(result * 10000) / 10000, numbersUsed };
      } catch (e) {
        return { valid: false, error: '橫式格式有誤（' + e.message + '），請檢查算式。' };
      }
    }

    /**
     * =========================================================================
     * 2. SVG 教科書級幾何標註繪圖輔助工具
     * =========================================================================
     */
    const SVG_NS = 'http://www.w3.org/2000/svg';

    function createSvgEl(tag, attrs = {}) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, v);
      }
      return el;
    }

    function drawRightAngle(container, vx, vy, ux1, uy1, ux2, uy2, size = 10) {
      const len1 = Math.hypot(ux1, uy1) || 1;
      const len2 = Math.hypot(ux2, uy2) || 1;
      const dx1 = (ux1 / len1) * size;
      const dy1 = (uy1 / len1) * size;
      const dx2 = (ux2 / len2) * size;
      const dy2 = (uy2 / len2) * size;

      const p1x = vx + dx1;
      const p1y = vy + dy1;
      const p2x = vx + dx1 + dx2;
      const p2y = vy + dy1 + dy2;
      const p3x = vx + dx2;
      const p3y = vy + dy2;

      container.appendChild(createSvgEl('polyline', {
        points: `${p1x},${p1y} ${p2x},${p2y} ${p3x},${p3y}`,
        fill: 'none',
        stroke: '#1e293b',
        'stroke-width': '1.6',
        'stroke-linejoin': 'miter'
      }));
    }

    function drawTextDim(container, p1, p2, label, offsetDist = 13, options = {}) {
      const [x1, y1] = p1;
      const [x2, y2] = p2;
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len < 1) return;

      const { outwardHint = null, fontSize = '15' } = options;

      let nx = -dy / len;
      let ny = dx / len;
      if (outwardHint) {
        const dot = nx * outwardHint[0] + ny * outwardHint[1];
        if (dot < 0) {
          nx = -nx;
          ny = -ny;
        }
      }

      const isHorizontalSide = Math.abs(nx) > 0.65;
      const extraShift = isHorizontalSide ? Math.min(26, label.length * 4 + 4) : 11;
      const mx = (x1 + x2) / 2 + nx * (offsetDist + extraShift - 11);
      const my = (y1 + y2) / 2 + ny * offsetDist;

      const textBg = createSvgEl('text', {
        x: mx,
        y: my,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        stroke: '#ffffff',
        'stroke-width': '4',
        'stroke-linejoin': 'round',
        fill: '#ffffff',
        'font-size': fontSize,
        'font-weight': '800',
        class: 'math-font'
      });
      textBg.textContent = label;
      container.appendChild(textBg);

      const textFg = createSvgEl('text', {
        x: mx,
        y: my,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        fill: '#0f172a',
        'font-size': fontSize,
        'font-weight': '800',
        class: 'math-font'
      });
      textFg.textContent = label;
      container.appendChild(textFg);
    }

    function drawArrowDim(container, p1, p2, label, offsetDist = 15, options = {}) {
      const [x1, y1] = p1;
      const [x2, y2] = p2;
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len < 1) return;

      const {
        extStart = 2,
        extOverhang = 5,
        outwardHint = null,
        fontSize = '15'
      } = options;

      let nx = -dy / len;
      let ny = dx / len;
      if (outwardHint) {
        const dot = nx * outwardHint[0] + ny * outwardHint[1];
        if (dot < 0) {
          nx = -nx;
          ny = -ny;
        }
      }

      const ax1 = x1 + nx * offsetDist;
      const ay1 = y1 + ny * offsetDist;
      const ax2 = x2 + nx * offsetDist;
      const ay2 = y2 + ny * offsetDist;

      const extEnd = offsetDist + extOverhang;
      container.appendChild(createSvgEl('line', {
        x1: x1 + nx * extStart,
        y1: y1 + ny * extStart,
        x2: x1 + nx * extEnd,
        y2: y1 + ny * extEnd,
        stroke: '#334155',
        'stroke-width': '1.25'
      }));
      container.appendChild(createSvgEl('line', {
        x1: x2 + nx * extStart,
        y1: y2 + ny * extStart,
        x2: x2 + nx * extEnd,
        y2: y2 + ny * extEnd,
        stroke: '#334155',
        'stroke-width': '1.25'
      }));

      container.appendChild(createSvgEl('line', {
        x1: ax1,
        y1: ay1,
        x2: ax2,
        y2: ay2,
        stroke: '#334155',
        'stroke-width': '1.45',
        'marker-start': 'url(#arrowStart)',
        'marker-end': 'url(#arrowEnd)'
      }));

      const isHorizontalShift = Math.abs(nx) > 0.65;
      const textDist = isHorizontalShift ? Math.min(26, label.length * 4 + 6) : 14;
      const mx = (ax1 + ax2) / 2 + nx * textDist;
      const my = (ay1 + ay2) / 2 + ny * textDist;

      const textBg = createSvgEl('text', {
        x: mx,
        y: my,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        stroke: '#ffffff',
        'stroke-width': '4',
        'stroke-linejoin': 'round',
        fill: '#ffffff',
        'font-size': fontSize,
        'font-weight': '800',
        class: 'math-font'
      });
      textBg.textContent = label;
      container.appendChild(textBg);

      const textFg = createSvgEl('text', {
        x: mx,
        y: my,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        fill: '#0f172a',
        'font-size': fontSize,
        'font-weight': '800',
        class: 'math-font'
      });
      textFg.textContent = label;
      container.appendChild(textFg);
    }

    function drawCallout(container, targetPt, labelPt, text, anchor = 'start') {
      const [tx, ty] = targetPt;
      const [lx, ly] = labelPt;
      const midX = anchor === 'start' ? lx - 14 : lx + 14;
      container.appendChild(createSvgEl('polyline', {
        points: `${lx},${ly} ${midX},${ly} ${tx},${ty}`,
        fill: 'none',
        stroke: '#1e293b',
        'stroke-width': '1.4',
        'marker-end': 'url(#pointerArrow)'
      }));

      const bg = createSvgEl('text', {
        x: lx + (anchor === 'start' ? 4 : -4),
        y: ly,
        'text-anchor': anchor,
        'dominant-baseline': 'central',
        stroke: '#ffffff',
        'stroke-width': '4',
        'stroke-linejoin': 'round',
        fill: '#ffffff',
        'font-size': '14',
        'font-weight': '800'
      });
      bg.textContent = text;
      container.appendChild(bg);

      const fg = createSvgEl('text', {
        x: lx + (anchor === 'start' ? 4 : -4),
        y: ly,
        'text-anchor': anchor,
        'dominant-baseline': 'central',
        fill: '#0f172a',
        'font-size': '14',
        'font-weight': '800'
      });
      fg.textContent = text;
      container.appendChild(fg);
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    /**
     * =========================================================================
     * 3. 第一關題型庫：分割法 (6個) + 填補法 (6個) —— 完整保留原有設定
     * =========================================================================
     */

      // ==================== 【第一關分割法：method = 'split'】 ====================

            polygon: [p0, p1, p2, p3, p4, p5],

      {

        generate() {

          return {

            polygon: [p0, p1, p2, p3, p4],

          return {

            subDesc: '觀察圖中的直角記號，運用分割法或填補法計算',

            polygon: [p0, p1, p2, p3, p4, p5],

            renderExtras(baseG, dimG) {
              baseG.appendChild(createSvgEl('line', {
                x1: p3[0], y1: p3[1], x2: p4[0] + 4, y2: p3[1],
                stroke: '#475569', 'stroke-width': '1.3', 'stroke-dasharray': '4,3'
              }));
              drawRightAngle(baseG, p0[0], p0[1], 1, 0, 0, -1);

    /**
     * =========================================================================
     * 4. 第二關題型庫：重疊圖形（完全依照圖片中的 4 類重疊幾何題型設計，每輪 8 題）
     * =========================================================================

    function polygonSignedArea(points) {
      let sum = 0;
      for (let i = 0; i < points.length; i++) {
        const a = points[i], b = points[(i + 1) % points.length];
        sum += a[0] * b[1] - b[0] * a[1];
      }
      return sum / 2;
    }

    function intersectConvexPolygons(subject, clip) {
      let output = subject.map(p => [...p]);
      const orientation = polygonSignedArea(clip) >= 0 ? 1 : -1;
      for (let i = 0; i < clip.length; i++) {
        const a = clip[i], b = clip[(i + 1) % clip.length];
        const input = output;
        output = [];
        if (!input.length) break;
        const cross = (p) => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
        const inside = (p) => orientation * cross(p) >= -1e-7;
        const intersection = (p, q) => {
          const cp = cross(p), cq = cross(q);
          const t = cp / (cp - cq);
          return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
        };
        let prev = input[input.length - 1];
        for (const curr of input) {
          const pin = inside(prev), cin = inside(curr);
          if (cin) {
            if (!pin) output.push(intersection(prev, curr));
            output.push(curr);
          } else if (pin) output.push(intersection(prev, curr));
          prev = curr;
        }
      }
      return output;
    }

    function level2ShapePolygon(type, dims, shiftXpx = 0, shiftYpx = 0) {
      const scale = 9;
      let points;
      if (type === 'triangle') {
        const cx = 230 + shiftXpx, yb = 340 + shiftYpx;
        const w = dims.base * scale, h = dims.height * scale;
        points = [[cx, yb - h], [cx - w / 2, yb], [cx + w / 2, yb]];
      } else if (type === 'trapezoid') {
        const x = 150 + shiftXpx, yb = 340 + shiftYpx;
        const bw = dims.bottom * scale, tw = dims.top * scale, h = dims.height * scale;
        points = [[x, yb], [x + bw, yb], [x + (bw + tw) / 2, yb - h], [x + (bw - tw) / 2, yb - h]];
      } else {
        const x = 150 + shiftXpx, yb = 350 + shiftYpx;
        const bw = dims.base * scale, h = dims.height * scale, slant = 36;
        points = [[x, yb], [x + bw, yb], [x + bw + slant, yb - h], [x + slant, yb - h]];
      }
      return points;
    }

    function level2Area(type, d) {
      if (type === 'triangle') return d.base * d.height / 2;
      if (type === 'trapezoid') return (d.top + d.bottom) * d.height / 2;
      return d.base * d.height;
    }

    function level2AreaExpression(type, d) {
      if (type === 'triangle') return `${d.base} × ${d.height} ÷ 2`;
      if (type === 'trapezoid') return `(${d.top} + ${d.bottom}) × ${d.height} ÷ 2`;
      return `${d.base} × ${d.height}`;

                'stroke-linejoin': 'round', class: 'math-font'
              });
              note.textContent = hollow
                ? '藍色：平行四邊形；紫色：三角形；白色虛線：挖空交集'
                : '藍色：平行四邊形；紫色：三角形；深紫色：實際交集';
              dimG.appendChild(note);
            }
          };
        }
      };
    }

    /**
     * =========================================================================
     * 4. 第二關題型庫：部分重疊的三角形、梯形、平行四邊形及混合圖形
     * =========================================================================

    const LEVEL2_TEMPLATES = [
      createPartialOverlapTemplate({
        id: 'partial_parallelogram_overlap', type: 'parallelogram', hollow: false,
        dims: { base: 18, height: 12 }, overlap: { base: 12, height: 8 }
      }),
      createTrapTriangleTemplate(false),
      createParaTriangleTemplate(false),
      createTrapTriangleTemplate(true),
      createParaTriangleTemplate(true)
    ];

    /**

    // 跨輪次防重複儲存（分別記錄第一關與第二關）
    function getStorageKey(lvl) {
      return `hk_p5_polygon_area_lvl_${lvl}_prev_v1`;
    }

    const roundHistory = {
      1: { signatures: new Set(), firstTemplateId: null },
      2: { signatures: new Set(), firstTemplateId: null }
    };

    [1, 2].forEach(lvl => {
      try {
        const saved = localStorage.getItem(getStorageKey(lvl));
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.signatures)) {
            roundHistory[lvl].signatures = new Set(parsed.signatures);
            roundHistory[lvl].firstTemplateId = parsed.firstTemplateId || null;
          }
        }
      } catch (e) {}
    });

    function getQuestionSignature(q) {
      return `${q.templateId}|${q.area}|${q.sampleExpr}`;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function createUniqueQuestion(lvl, templateObj = null, preferredMethod = null) {
      const poolSource = lvl === 1 ? LEVEL1_TEMPLATES : LEVEL2_TEMPLATES;
      let tpl = templateObj;
      if (!tpl) {
        const recentIds = state.questions.slice(-2).map(q => q.templateId);
        let pool = poolSource;
        if (preferredMethod) {
          const filtered = pool.filter(t => t.method === preferredMethod);
          if (filtered.length > 0) pool = filtered;
        }
        const candidates = pool.filter(t => !recentIds.includes(t.id));
        tpl = pickRandom(candidates.length > 0 ? candidates : pool);
      }

      const prevSigs = roundHistory[lvl].signatures;
      for (let attempt = 0; attempt < 40; attempt++) {
        const q = tpl.generate();
        q.templateId = tpl.id;
        q.method = tpl.method;
        const sig = getQuestionSignature(q);
        const dupInCurrent = state.questions.some(
          existing => existing.templateId === q.templateId && existing.area === q.area
        );
        if (!dupInCurrent && !prevSigs.has(sig)) {
          return q;
        }
      }
      const fallback = tpl.generate();
      fallback.templateId = tpl.id;
      fallback.method = tpl.method;
      return fallback;
    }

        dom.methodBtn1Label.textContent = '🔄 兩圖相加減重疊';

    // 初始化指定關卡（每關 8 題，每次進入均與前一次不同）
    function initPractice(lvl = state.level) {
      if (state.questions && state.questions.length > 0 && state.level === lvl) {
        roundHistory[lvl].signatures = new Set(state.questions.map(getQuestionSignature));
        roundHistory[lvl].firstTemplateId = state.questions[0].templateId;
      }

      state.level = lvl;
      state.questions = [];
      state.currentIndex = 0;
      state.initialTotal = lvl === 1 ? 8 : 5;
      state.addedQuestionsCount = 0;
      state.firstTryCorrectCount = 0;

      updateLevelThemeUI(lvl);

      let mixedQuestions = [];

      if (lvl === 1) {
        // 第一關：4 題分割法 + 4 題填補法，全隨機抽題並打亂
        const splitTemplates = LEVEL1_TEMPLATES.filter(t => t.method === 'split');
        const fillTemplates = LEVEL1_TEMPLATES.filter(t => t.method === 'fill');

        const selectedSplitList = shuffleArray(splitTemplates).slice(0, 4).map(tpl => {
          const q = createUniqueQuestion(1, tpl, 'split');
          state.questions.push(q);
          return q;
        });

        const selectedFillList = shuffleArray(fillTemplates).slice(0, 4).map(tpl => {
          const q = createUniqueQuestion(1, tpl, 'fill');
          state.questions.push(q);
          return q;
        });

        mixedQuestions = shuffleArray([...selectedSplitList, ...selectedFillList]);
      } else {
        // 第二關：5 種圖形組合（包含三角形、梯形、平行四邊形及重疊／挖空）各出 1 題
        const selectedList = [];
        LEVEL2_TEMPLATES.forEach(tpl => {
          const q = createUniqueQuestion(2, tpl, tpl.method);
          state.questions.push(q);
          selectedList.push(q);
        });
        mixedQuestions = shuffleArray(selectedList);
      }

      // 確保本輪第 1 題的圖形類型也與上一輪第 1 題不同
      const prevFirstId = roundHistory[lvl].firstTemplateId;
      if (prevFirstId && mixedQuestions[0].templateId === prevFirstId) {
        const diffIdx = mixedQuestions.findIndex(q => q.templateId !== prevFirstId);
        if (diffIdx > 0) {
          [mixedQuestions[0], mixedQuestions[diffIdx]] = [mixedQuestions[diffIdx], mixedQuestions[0]];
        }
      }

      state.questions = mixedQuestions;

      const currentSignatures = state.questions.map(getQuestionSignature);
      roundHistory[lvl].signatures = new Set(currentSignatures);
      roundHistory[lvl].firstTemplateId = state.questions[0].templateId;
      try {
        localStorage.setItem(getStorageKey(lvl), JSON.stringify({
          signatures: currentSignatures,
          firstTemplateId: state.questions[0].templateId
        }));
      } catch (e) {}

      dom.summaryScreen.classList.add('hidden');
      dom.summaryScreen.classList.remove('flex');
      dom.practiceArea.classList.remove('hidden');

      loadQuestion(0);
    }

    function loadQuestion(index) {
      state.currentIndex = index;
      state.currentWrongAttempts = 0;
      state.currentQuestionHadError = false;
      state.currentQuestionSolved = false;
      state.userLines = [];
      state.isDrawing = false;
      state.dragStart = null;
      state.dragCurrent = null;
      state.activeSnap = null;
      state.showHintLines = false;

      const q = state.questions[index];

      updateProgressUI();

      dom.questionTitle.textContent = q.title || '求下圖著色多邊形的面積。';
      dom.questionSubDesc.textContent = q.subDesc || '';
      dom.answerLabel.textContent = q.answerPrompt || '步驟 3：計算多邊形的面積';
      dom.unitDisplay.textContent = `${q.unit}²`;
      dom.attemptStatusBadge.textContent = '首次作答';
      dom.attemptStatusBadge.className = 'text-xs font-bold px-2.5 py-1 rounded-full bg-sky-100 text-sky-700';

      dom.expressionInput.value = '';
      dom.answerInput.value = '';
      dom.expressionInput.disabled = false;
      dom.answerInput.disabled = false;
      dom.feedbackBox.classList.add('hidden');
      dom.showHintLineBtn.classList.add('hidden');
      dom.showHintLineBtn.classList.remove('flex');

      dom.submitBtn.classList.remove('hidden');
      dom.nextBtn.classList.add('hidden');
      dom.nextBtn.classList.remove('flex');

      setMethod('split');
      renderGeometry(q);
      updateLineToolButtons();
    }

    function updateProgressUI() {
      const total = state.questions.length;
      const currentNum = state.currentIndex + 1;
      dom.progressText.textContent = `第 ${currentNum} / ${total} 題`;
      const pct = Math.min(100, Math.round(((state.currentIndex + (state.currentQuestionSolved ? 1 : 0)) / total) * 100));
      dom.progressBar.style.width = `${Math.max(12.5, pct)}%`;

      if (state.addedQuestionsCount > 0) {
        dom.penaltyBadge.classList.remove('hidden');
        dom.penaltyBadge.classList.add('flex');
        dom.addedCountText.textContent = `+${state.addedQuestionsCount} 題`;
      } else {
        dom.penaltyBadge.classList.add('hidden');
        dom.penaltyBadge.classList.remove('flex');
      }
    }

    /**
     * =========================================================================
     * 6. 渲染 SVG 幾何圖形與學生輔助線
     * =========================================================================
     */
    function renderGeometry(q) {
      dom.layerBaseShape.innerHTML = '';
      dom.layerHintLines.innerHTML = '';
      dom.layerDimensions.innerHTML = '';

      if (typeof q.customRender === 'function') {
        q.customRender(dom.layerBaseShape, dom.layerDimensions);
      } else {
        const pointsStr = q.polygon.map(p => `${p[0]},${p[1]}`).join(' ');
        const polyEl = createSvgEl('polygon', {
          points: pointsStr,
          fill: '#89cff0',
          'fill-opacity': '0.85',
          stroke: '#1e293b',
          'stroke-width': '2.2',
          'stroke-linejoin': 'round'
        });
        dom.layerBaseShape.appendChild(polyEl);
        q.renderExtras(dom.layerBaseShape, dom.layerDimensions);
      }

      if (state.showHintLines && q.hintLines) {
        q.hintLines.forEach(([pA, pB]) => {
          dom.layerHintLines.appendChild(createSvgEl('line', {
            x1: pA[0], y1: pA[1], x2: pB[0], y2: pB[1],
            stroke: '#f59e0b',
            'stroke-width': '3',
            'stroke-dasharray': '7,5',
            'stroke-linecap': 'round'
          }));
        });
      }

      renderUserLines();
    }

    function renderUserLines() {
      dom.layerUserLines.innerHTML = '';
      state.userLines.forEach(line => {
        dom.layerUserLines.appendChild(createSvgEl('line', {
          x1: line.x1,
          y1: line.y1,
          x2: line.x2,
          y2: line.y2,
          stroke: '#e11d48',
          'stroke-width': '2.6',
          'stroke-dasharray': '6,4',
          'stroke-linecap': 'round'
        }));
        [
          [line.x1, line.y1],
          [line.x2, line.y2]
        ].forEach(([cx, cy]) => {
          dom.layerUserLines.appendChild(createSvgEl('circle', {
            cx, cy, r: '3.5',
            fill: '#e11d48'
          }));
        });
      });
    }

    function updateLineToolButtons() {
      const hasLines = state.userLines.length > 0;
      dom.undoLineBtn.disabled = !hasLines;
      dom.clearLinesBtn.disabled = !hasLines;
    }

    /**
     * =========================================================================
     * 7. 互動輔助線繪圖（支援滑鼠、觸控與頂點自動吸附）
     * =========================================================================
     */
    function getSvgCoords(evt) {
      const rect = dom.svg.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      const x = ((clientX - rect.left) / rect.width) * 600;
      const y = ((clientY - rect.top) / rect.height) * 450;
      return { x, y };
    }

    function findSnapPoint(pt) {
      const q = state.questions[state.currentIndex];
      if (!q || !q.snapPoints) return null;
      const SNAP_RADIUS = 18;
      let nearest = null;
      let minDist = SNAP_RADIUS;
      for (const [sx, sy] of q.snapPoints) {
        const d = Math.hypot(pt.x - sx, pt.y - sy);
        if (d < minDist) {
          minDist = d;
          nearest = { x: sx, y: sy };
        }
      }
      return nearest;
    }

    function renderPreviewAndSnap() {
      dom.layerSnapAndPreview.innerHTML = '';

      const q = state.questions[state.currentIndex];
      if (state.drawMode && q && q.snapPoints) {
        q.snapPoints.forEach(([sx, sy]) => {
          dom.layerSnapAndPreview.appendChild(createSvgEl('circle', {
            cx: sx, cy: sy, r: '4',
            fill: '#0284c7',
            'fill-opacity': '0.35'
          }));
        });
      }

      if (state.activeSnap) {
        dom.layerSnapAndPreview.appendChild(createSvgEl('circle', {
          cx: state.activeSnap.x,
          cy: state.activeSnap.y,
          r: '8',
          fill: 'none',
          stroke: '#e11d48',
          'stroke-width': '2'
        }));
      }

      if (state.isDrawing && state.dragStart && state.dragCurrent) {
        dom.layerSnapAndPreview.appendChild(createSvgEl('line', {
          x1: state.dragStart.x,
          y1: state.dragStart.y,
          x2: state.dragCurrent.x,
          y2: state.dragCurrent.y,
          stroke: '#e11d48',
          'stroke-width': '2.5',
          'stroke-dasharray': '5,4'
        }));
      }
    }

    function handlePointerDown(evt) {
      if (!state.drawMode) return;
      evt.preventDefault();
      const rawPt = getSvgCoords(evt);
      const snapped = findSnapPoint(rawPt) || rawPt;
      state.isDrawing = true;
      state.dragStart = snapped;
      state.dragCurrent = snapped;
      state.activeSnap = findSnapPoint(rawPt);
      renderPreviewAndSnap();
    }

    function handlePointerMove(evt) {
      if (!state.drawMode) return;
      const rawPt = getSvgCoords(evt);
      const snapped = findSnapPoint(rawPt);
      state.activeSnap = snapped;
      if (state.isDrawing) {
        evt.preventDefault();
        state.dragCurrent = snapped || rawPt;
      }
      renderPreviewAndSnap();
    }

    function handlePointerUp() {
      if (!state.isDrawing) return;
      if (state.dragStart && state.dragCurrent) {
        const dist = Math.hypot(
          state.dragCurrent.x - state.dragStart.x,
          state.dragCurrent.y - state.dragStart.y
        );
        if (dist > 10) {
          state.userLines.push({
            x1: state.dragStart.x,
            y1: state.dragStart.y,
            x2: state.dragCurrent.x,
            y2: state.dragCurrent.y
          });
          renderUserLines();
          updateLineToolButtons();
        }
      }
      state.isDrawing = false;
      state.dragStart = null;
      state.dragCurrent = null;
      renderPreviewAndSnap();
    }

    dom.svg.addEventListener('mousedown', handlePointerDown);
    dom.svg.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    dom.svg.addEventListener('touchstart', handlePointerDown, { passive: false });
    dom.svg.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerUp);

    dom.toggleDrawBtn.addEventListener('click', () => {
      state.drawMode = !state.drawMode;
      if (state.drawMode) {
        dom.toggleDrawBtn.classList.replace('bg-white', 'bg-sky-600');
        dom.toggleDrawBtn.classList.replace('text-slate-700', 'text-white');
        dom.svg.classList.add('cursor-crosshair');
      } else {
        dom.toggleDrawBtn.classList.replace('bg-sky-600', 'bg-white');
        dom.toggleDrawBtn.classList.replace('text-white', 'text-slate-700');
        dom.svg.classList.remove('cursor-crosshair');
      }
      renderPreviewAndSnap();
    });

    dom.undoLineBtn.addEventListener('click', () => {
      state.userLines.pop();
      renderUserLines();
      updateLineToolButtons();
    });

    dom.clearLinesBtn.addEventListener('click', () => {
      state.userLines = [];
      renderUserLines();
      updateLineToolButtons();
    });

    dom.showHintLineBtn.addEventListener('click', () => {
      state.showHintLines = true;
      renderGeometry(state.questions[state.currentIndex]);
    });

    /**
     * =========================================================================
     * 8. 右側列式計算交互、驗證與錯題懲罰機制
     * =========================================================================
     */
    function setMethod(method) {
      state.selectedMethod = method;
      if (method === 'split') {
        dom.methodSplitBtn.className = 'method-btn flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-2xl border-2 border-sky-500 bg-sky-50 text-sky-800 font-bold text-sm transition';
        dom.methodFillBtn.className = 'method-btn flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-2xl border-2 border-slate-200 bg-white text-slate-600 hover:border-slate-300 font-bold text-sm transition';
      } else {
        dom.methodFillBtn.className = 'method-btn flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-2xl border-2 border-indigo-500 bg-indigo-50 text-indigo-800 font-bold text-sm transition';
        dom.methodSplitBtn.className = 'method-btn flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-2xl border-2 border-slate-200 bg-white text-slate-600 hover:border-slate-300 font-bold text-sm transition';
      }
    }

    dom.methodSplitBtn.addEventListener('click', () => setMethod('split'));
    dom.methodFillBtn.addEventListener('click', () => setMethod('fill'));

    document.querySelectorAll('.sym-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (dom.expressionInput.disabled) return;
        const sym = btn.getAttribute('data-symbol');
        const input = dom.expressionInput;
        const start = input.selectionStart ?? input.value.length;
        const end = input.selectionEnd ?? input.value.length;
        input.value = input.value.slice(0, start) + sym + input.value.slice(end);
        input.focus();
        const newPos = start + sym.length;
        input.setSelectionRange(newPos, newPos);
      });
    });

    dom.clearExprBtn.addEventListener('click', () => {
      if (dom.expressionInput.disabled) return;
      dom.expressionInput.value = '';
      dom.expressionInput.focus();
    });

    function showFeedback(type, title, message) {
      dom.feedbackBox.classList.remove('hidden', 'animate-shake');
      void dom.feedbackBox.offsetWidth;

      if (type === 'success') {
        dom.feedbackBox.className = 'rounded-2xl p-4 border-2 border-emerald-300 bg-emerald-50 text-emerald-900 text-sm leading-relaxed animate-pop';
        dom.feedbackIcon.textContent = '🎉';
      } else if (type === 'error') {
        dom.feedbackBox.className = 'rounded-2xl p-4 border-2 border-rose-300 bg-rose-50 text-rose-900 text-sm leading-relaxed animate-shake';
        dom.feedbackIcon.textContent = '❌';
      } else {
        dom.feedbackBox.className = 'rounded-2xl p-4 border-2 border-amber-300 bg-amber-50 text-amber-900 text-sm leading-relaxed animate-pop';
        dom.feedbackIcon.textContent = '💡';
      }

      dom.feedbackTitle.textContent = title;
      dom.feedbackMessage.textContent = message;
    }

    function registerWrongAttempt() {
      state.currentWrongAttempts++;

      if (!state.currentQuestionHadError) {
        state.currentQuestionHadError = true;
        state.addedQuestionsCount++;
        const currentMethod = state.questions[state.currentIndex].method;
        const newQuestion = createUniqueQuestion(state.level, null, currentMethod);
        state.questions.push(newQuestion);
        updateProgressUI();
      }

      dom.attemptStatusBadge.textContent = `需完成改正（第 ${state.currentWrongAttempts} 次錯誤）`;
      dom.attemptStatusBadge.className = 'text-xs font-bold px-2.5 py-1 rounded-full bg-rose-100 text-rose-700';

      if (state.currentWrongAttempts >= 2) {
        dom.showHintLineBtn.classList.remove('hidden');
        dom.showHintLineBtn.classList.add('flex');
      }
    }

    function handleVerify() {
      if (state.currentQuestionSolved) return;

      const q = state.questions[state.currentIndex];
      const rawExpr = dom.expressionInput.value.trim();
      const rawAns = dom.answerInput.value.trim();

      const evalResult = evaluateMathExpression(rawExpr);
      if (!evalResult.valid) {
        registerWrongAttempt();
        showFeedback(
          'error',
          '橫式未完成或格式有誤（必須先寫對橫式）',
          `${evalResult.error}（本題答錯已新增 1 題練習，請改正橫式後再提交！）`
        );
        dom.expressionInput.focus();
        return;
      }

      if (Math.abs(evalResult.value - q.area) > 0.01) {
        registerWrongAttempt();
        showFeedback(
          'error',
          `橫式不正確！你的橫式算出來是 ${evalResult.value}，與正確面積不符。`,
          `請先改正橫式，才能核對答案！${q.hintText}（已為你新增 1 題練習）`
        );
        dom.expressionInput.focus();
        return;
      }

      if (rawAns === '') {
        showFeedback(
          'warning',
          '橫式正確！請繼續填寫最後答案',
          `你的橫式列式正確！請在下方「面積 = 」空格輸入計算結果，再按核對。`
        );
        dom.answerInput.focus();
        return;
      }

      const studentAns = parseFloat(rawAns);
      if (Number.isNaN(studentAns) || Math.abs(studentAns - q.area) > 0.01) {
        registerWrongAttempt();
        showFeedback(
          'error',
          '橫式已正確，但最後計算的答案不正確！',
          `你的橫式完全正確，請重新小心計算這條橫式的得數並改正答案！（本題答錯已新增 1 題練習）`
        );
        dom.answerInput.focus();
        return;
      }

      state.currentQuestionSolved = true;
      if (!state.currentQuestionHadError) {
        state.firstTryCorrectCount++;
      }

      dom.expressionInput.disabled = true;
      dom.answerInput.disabled = true;
      dom.attemptStatusBadge.textContent = state.currentQuestionHadError ? '✅ 已完成改正' : '🌟 一次答對';
      dom.attemptStatusBadge.className = 'text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700';

      updateProgressUI();

      const extraNote = state.currentQuestionHadError
        ? `你已成功改正本題！因剛才有答錯紀錄，練習總題數已調整為 ${state.questions.length} 題。`
        : `太棒了！一次就列出正確橫式並算出面積 ${q.area} ${q.unit}²！`;

      showFeedback(
        'success',
        `答對了！正確面積是 ${q.area} ${q.unit}²`,
        `${extraNote}（參考橫式：${q.sampleExpr} = ${q.area}）`
      );

      dom.submitBtn.classList.add('hidden');
      dom.nextBtn.classList.remove('hidden');
      dom.nextBtn.classList.add('flex');

      const isLast = state.currentIndex + 1 >= state.questions.length;
      dom.nextBtnText.textContent = isLast ? '查看本關成績總結' : '進入下一題';
    }

    dom.submitBtn.addEventListener('click', handleVerify);

    [dom.expressionInput, dom.answerInput].forEach(inp => {
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!state.currentQuestionSolved) handleVerify();
          else dom.nextBtn.click();
        }
      });
    });

    dom.nextBtn.addEventListener('click', () => {
      if (!state.currentQuestionSolved) return;
      if (state.currentIndex + 1 < state.questions.length) {
        loadQuestion(state.currentIndex + 1);
      } else {
        showSummary();
      }
    });

    function showSummary() {
      dom.practiceArea.classList.add('hidden');
      dom.summaryScreen.classList.remove('hidden');
      dom.summaryScreen.classList.add('flex');

      const total = state.questions.length;
      const firstTry = state.firstTryCorrectCount;
      const added = state.addedQuestionsCount;
      const accuracy = Math.round((firstTry / total) * 100);

      dom.statTotal.textContent = total;
      dom.statFirstTry.textContent = firstTry;
      dom.statAdded.textContent = `+${added}`;
      dom.statAccuracy.textContent = `${accuracy}%`;

      if (state.level === 1) {
        dom.summaryTitle.textContent = '🎉 恭喜你完成第一關（分割法與填補法）！';
        dom.summaryDesc.textContent = '第一關已順利過關！現在可以點擊下方按鈕進入第二關挑戰「重疊圖形的面積」。';
        dom.goNextLevelBtn.classList.remove('hidden');
      } else {
        dom.summaryTitle.textContent = '🏆 恭喜你完成第二關（重疊圖形的面積）！';
        dom.summaryDesc.textContent = '太厲害了！你已經全面掌握香港小學五年級「多邊形的面積」所有進階題型！';
        dom.goNextLevelBtn.classList.add('hidden');
      }
    }

    // 關卡切換與重新開始事件
    dom.level1TabBtn.addEventListener('click', () => initPractice(1));
    dom.level2TabBtn.addEventListener('click', () => initPractice(2));
    dom.goNextLevelBtn.addEventListener('click', () => initPractice(2));
    dom.restartBtn.addEventListener('click', () => initPractice(state.level));

    window.addEventListener('DOMContentLoaded', () => initPractice(1));
  </script>
</body>
</html>
